name: Bruma checks

on:
  push:
    branches: [main, migration/cloudflare-api]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend-worker-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run migration contract tests
        run: npm test
