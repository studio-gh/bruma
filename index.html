<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bruma: painel de sincronização</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --sky-top:#4A8FD6; --sky-mid:#8FC1EA; --sky-bottom:#EEF6FC;
    --ink:#233240; --ink-soft:#5C7286; --blue-deep:#2E6CA8;
    --line:#D7E6F2; --glass:rgba(255,255,255,.75);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; color:var(--ink); font-family:'DM Sans',system-ui,sans-serif; line-height:1.55;
    background:linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 40%, var(--sky-bottom) 100%);
  }
  .wrap{max-width:640px; margin:0 auto; padding:56px 20px 80px;}
  .kicker{color:#fff; font-weight:700; font-size:12px; letter-spacing:.14em; text-transform:uppercase; text-shadow:0 1px 6px rgba(0,0,0,.15);}
  h1{font-family:'Fraunces',serif; font-weight:700; color:#fff; font-size:28px; margin:8px 0 28px; text-shadow:0 2px 12px rgba(0,40,80,.18);}

  .card{background:var(--glass); border:1px solid rgba(255,255,255,.8); border-radius:18px; padding:24px; margin-bottom:18px; box-shadow:0 14px 34px -22px rgba(0,40,80,.35);}
  .card p{margin:0 0 14px; color:var(--ink-soft); font-size:14px;}
  #user-info{color:var(--ink); font-weight:700; font-size:14px; margin-bottom:18px;}

  button{background:var(--blue-deep); color:#fff; border:none; border-radius:999px; padding:11px 22px; font-weight:700; cursor:pointer; font-size:14px;}
  button:disabled{opacity:.5; cursor:default;}
  input{border:1px solid var(--line); background:#fff; border-radius:8px; padding:10px 14px; font-size:14px; font-family:'DM Sans',sans-serif; color:var(--ink); width:260px;}
  .row{display:flex; gap:10px; align-items:center; margin-bottom:18px; flex-wrap:wrap;}

  .log{background:rgba(255,255,255,.6); border:1px solid rgba(255,255,255,.8); border-radius:14px; padding:16px; font-size:13px; color:var(--ink-soft); white-space:pre-wrap; max-height:220px; overflow:auto; font-family:ui-monospace,monospace;}
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(100px,1fr)); gap:10px; margin-top:4px;}
  .grid img{width:100%; aspect-ratio:1; object-fit:cover; border-radius:10px; background:var(--line); border:1px solid rgba(255,255,255,.8);}
  .hidden{display:none;}
</style>
</head>
<body>
<div class="wrap">
  <div class="kicker">Bruma</div>
  <h1>Painel de sincronização</h1>

  <!--
    Antes de usar: preencha SUPABASE_URL e SUPABASE_ANON_KEY abaixo
    (Supabase: Project Settings > API).
  -->
  <script>
    const SUPABASE_URL = "https://wccbsykrswcxnckcasea.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_05vKj-uq-oo0zbTWKUDITw_qYsJZnCd";
  </script>

  <div class="card" id="login-section">
    <p>Entre com sua conta Google para conectar o Drive.</p>
    <button id="login-btn">Entrar com Google</button>
  </div>

  <div class="card hidden" id="app-section">
    <p id="user-info"></p>
    <div class="row">
      <input id="folder-id" placeholder="ID da pasta do Google Drive">
      <button id="sync-btn">Sincronizar pasta</button>
    </div>
    <div class="grid" id="asset-grid"></div>
  </div>

  <div class="log" id="log"></div>
</div>

<script>
  function log(msg) {
    const el = document.getElementById("log");
    el.textContent += msg + "\n";
    el.scrollTop = el.scrollHeight;
  }

  if (SUPABASE_URL.includes("COLE_AQUI") || SUPABASE_ANON_KEY.includes("COLE_AQUI")) {
    log("Preencha SUPABASE_URL e SUPABASE_ANON_KEY no topo do arquivo antes de usar (Project Settings > API no Supabase).");
  }

  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  let providerToken = null;
  let currentWorkspaceId = null;
  let currentConnectionId = null;
  let loginHandled = false; // evita rodar afterLogin() duas vezes pra mesma sessão

  document.getElementById("login-btn").addEventListener("click", async () => {
    const { error } = await sb.auth.signInWithOAuth({
      provider: "google",
      options: {
        scopes: "https://www.googleapis.com/auth/drive.readonly",
        redirectTo: window.location.origin + window.location.pathname,
        queryParams: { access_type: "offline", prompt: "consent" }
      }
    });
    if (error) log("Erro ao iniciar login: " + error.message);
  });

  sb.auth.onAuthStateChange(async (event, session) => {
    if (event === "SIGNED_IN" && session) {
      if (session.provider_token) providerToken = session.provider_token;
      await checkTokenScope();
      await afterLogin(session);
    }
  });

  // Diagnóstico: pergunta pro próprio Google quais escopos esse token realmente carrega.
  async function checkTokenScope() {
    if (!providerToken) { log("Diagnóstico: nenhum provider_token recebido do Supabase."); return; }
    try {
      const res = await fetch("https://www.googleapis.com/oauth2/v3/tokeninfo?access_token=" + providerToken);
      const data = await res.json();
      if (data.scope) {
        log("Diagnóstico: escopos concedidos ao token -> " + data.scope);
        log("Diagnóstico: tem drive.readonly? " + (data.scope.includes("drive.readonly") ? "sim" : "NÃO"));
      } else {
        log("Diagnóstico: tokeninfo não retornou escopo. Resposta: " + JSON.stringify(data));
      }
    } catch (err) {
      log("Diagnóstico: falha ao consultar tokeninfo: " + err.message);
    }
  }

  async function afterLogin(session) {
    if (loginHandled) return;
    loginHandled = true;

    document.getElementById("login-section").classList.add("hidden");
    document.getElementById("app-section").classList.remove("hidden");
    document.getElementById("user-info").textContent = "Logado como " + session.user.email;

    let { data: workspaces } = await sb
      .from("workspaces")
      .select("id")
      .eq("owner_id", session.user.id)
      .limit(1);

    if (!workspaces || workspaces.length === 0) {
      const { data: created, error } = await sb
        .from("workspaces")
        .insert({ owner_id: session.user.id, name: "Meu workspace" })
        .select("id")
        .single();
      if (error) { log("Erro ao criar workspace: " + error.message); return; }
      currentWorkspaceId = created.id;
      log("Workspace criado.");
    } else {
      currentWorkspaceId = workspaces[0].id;
    }

    if (!providerToken) {
      log("Aviso: não recebi o token do Google nesta sessão. Se a sincronização falhar com erro de autorização, saia e entre de novo.");
      return;
    }

    const { data: existingConn } = await sb
      .from("cloud_connections")
      .select("id")
      .eq("workspace_id", currentWorkspaceId)
      .eq("provider", "google_drive")
      .limit(1);

    if (existingConn && existingConn.length > 0) {
      currentConnectionId = existingConn[0].id;
      await sb
        .from("cloud_connections")
        .update({ access_token: providerToken })
        .eq("id", currentConnectionId);
      log("Conexão com o Google Drive atualizada.");
    } else {
      const { data: conn, error } = await sb
        .from("cloud_connections")
        .insert({
          workspace_id: currentWorkspaceId,
          provider: "google_drive",
          access_token: providerToken
        })
        .select("id")
        .single();
      if (error) { log("Erro ao salvar conexão: " + error.message); return; }
      currentConnectionId = conn.id;
      log("Conexão com o Google Drive criada.");
    }
  }

  document.getElementById("sync-btn").addEventListener("click", async () => {
    const folderId = document.getElementById("folder-id").value.trim();
    if (!folderId) { log("Cole o ID de uma pasta do Drive primeiro."); return; }
    if (!providerToken) { log("Sem token do Google nesta sessão. Saia e entre de novo pra gerar um novo."); return; }

    log("Buscando arquivos da pasta " + folderId + "...");
    const url = "https://www.googleapis.com/drive/v3/files"
      + "?q=" + encodeURIComponent(`'${folderId}' in parents and trashed = false`)
      + "&fields=" + encodeURIComponent("files(id,name,thumbnailLink,imageMediaMetadata)")
      + "&pageSize=100";

    let files = [];
    try {
      const res = await fetch(url, { headers: { Authorization: "Bearer " + providerToken } });
      if (!res.ok) {
        const body = await res.text();
        log("Erro da Drive API (" + res.status + "): " + body);
        return;
      }
      const data = await res.json();
      files = data.files || [];
    } catch (err) {
      log("Erro de rede ao chamar a Drive API: " + err.message);
      return;
    }

    log(files.length + " arquivo(s) encontrado(s). Criando a galeria e salvando...");

    let { data: galleries } = await sb
      .from("galleries")
      .select("id")
      .eq("folder_id", folderId)
      .limit(1);

    let galleryId;
    if (galleries && galleries.length > 0) {
      galleryId = galleries[0].id;
    } else {
      const { data: gallery, error } = await sb
        .from("galleries")
        .insert({
          workspace_id: currentWorkspaceId,
          cloud_connection_id: currentConnectionId,
          title: "Pasta " + folderId,
          slug: "pasta-" + folderId.slice(0, 8).toLowerCase(),
          folder_id: folderId
        })
        .select("id")
        .single();
      if (error) { log("Erro ao criar galeria: " + error.message); return; }
      galleryId = gallery.id;
    }

    const grid = document.getElementById("asset-grid");
    grid.innerHTML = "";

    for (const file of files) {
      await sb.from("assets").upsert({
        gallery_id: galleryId,
        provider_file_id: file.id,
        filename: file.name,
        thumbnail_url: file.thumbnailLink || null,
        width: file.imageMediaMetadata ? file.imageMediaMetadata.width : null,
        height: file.imageMediaMetadata ? file.imageMediaMetadata.height : null
      }, { onConflict: "provider_file_id" });

      if (file.thumbnailLink) {
        const img = document.createElement("img");
        img.src = file.thumbnailLink;
        img.title = file.name;
        grid.appendChild(img);
      }
    }

    log("Sincronização concluída.");
  });

  sb.auth.getSession().then(({ data }) => {
    if (data.session) afterLogin(data.session);
  });
</script>
</body>
</html>
