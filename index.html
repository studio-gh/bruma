<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bruma: painel de sincronização</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --sky-top:#4A8FD6; --sky-mid:#8FC1EA; --sky-bottom:#EEF6FC;
    --ink:#233240; --ink-soft:#5C7286; --blue-deep:#2E6CA8;
    --line:#D7E6F2; --glass:rgba(255,255,255,.75);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; color:var(--ink); font-family:'DM Sans',system-ui,sans-serif; line-height:1.55;
    background:linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 40%, var(--sky-bottom) 100%);
  }
  .wrap{max-width:640px; margin:0 auto; padding:56px 20px 80px;}
  .kicker{color:#fff; font-weight:700; font-size:12px; letter-spacing:.14em; text-transform:uppercase; text-shadow:0 1px 6px rgba(0,0,0,.15);}
  h1{font-family:'Fraunces',serif; font-weight:700; color:#fff; font-size:28px; margin:8px 0 28px; text-shadow:0 2px 12px rgba(0,40,80,.18);}

  .card{background:var(--glass); border:1px solid rgba(255,255,255,.8); border-radius:18px; padding:24px; margin-bottom:18px; box-shadow:0 14px 34px -22px rgba(0,40,80,.35);}
  .card p{margin:0 0 14px; color:var(--ink-soft); font-size:14px;}
  #user-info{color:var(--ink); font-weight:700; font-size:14px; margin-bottom:18px;}

  button{background:var(--blue-deep); color:#fff; border:none; border-radius:999px; padding:11px 22px; font-weight:700; cursor:pointer; font-size:14px;}
  button:disabled{opacity:.5; cursor:default;}
  input{border:1px solid var(--line); background:#fff; border-radius:8px; padding:10px 14px; font-size:14px; font-family:'DM Sans',sans-serif; color:var(--ink); width:260px;}
  .row{display:flex; gap:10px; align-items:center; margin-bottom:18px; flex-wrap:wrap;}

  .log{background:rgba(255,255,255,.6); border:1px solid rgba(255,255,255,.8); border-radius:14px; padding:16px; font-size:13px; color:var(--ink-soft); white-space:pre-wrap; max-height:220px; overflow:auto; font-family:ui-monospace,monospace;}
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(100px,1fr)); gap:10px; margin-top:4px;}
  .grid img{width:100%; aspect-ratio:1; object-fit:cover; border-radius:10px; background:var(--line); border:1px solid rgba(255,255,255,.8);}
  .hidden{display:none;}
  #sync-status{font-size:13px; color:var(--ink-soft); margin:-8px 0 14px; min-height:18px;}
  .progress-wrap{margin:-2px 0 18px;}
  .progress-track{width:100%; height:8px; background:rgba(255,255,255,.65); border:1px solid rgba(255,255,255,.8); border-radius:999px; overflow:hidden;}
  .progress-bar{height:100%; width:0%; background:var(--blue-deep); border-radius:999px; transition:width .2s ease;}
  .progress-meta{display:flex; justify-content:space-between; gap:12px; margin-top:7px; font-size:12px; color:var(--ink-soft);}
  .gallery-row{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 0; border-bottom:1px solid var(--line);}
  .gallery-row:last-child{border-bottom:none;}
  .gallery-row .meta{font-size:13px;}
  .gallery-row .meta .title{font-weight:700; color:var(--ink);}
  .gallery-row .meta .sub{color:var(--ink-soft);}
  .remove-btn{background:none; border:1px solid rgba(200,80,80,.5); color:#B84C4C; padding:6px 14px; font-size:12px; border-radius:999px;}
  .session-row{display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:18px;}
  .logout-btn{background:rgba(255,255,255,.55); color:var(--ink-soft); border:1px solid rgba(92,114,134,.25); padding:7px 14px; font-size:12px;}
  .empty-note{color:var(--ink-soft); font-size:13px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="kicker">Bruma</div>
  <h1>Painel de sincronização</h1>

  <script>
    const SUPABASE_URL = "https://wccbsykrswcxnckcasea.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_05vKj-uq-oo0zbTWKUDITw_qYsJZnCd";
  </script>

  <div class="card" id="login-section">
    <p>Entre com sua conta Google para conectar o Drive.</p>
    <button id="login-btn">Entrar com Google</button>
  </div>

  <div class="card hidden" id="app-section">
    <div class="session-row">
      <p id="user-info"></p>
      <button id="logout-btn" class="logout-btn">Sair</button>
    </div>

    <div class="row">
      <input id="folder-id" placeholder="ID da pasta do Google Drive">
      <button id="sync-btn">Sincronizar pasta</button>
    </div>

    <div id="sync-status" class="hidden"></div>

    <div id="sync-progress" class="progress-wrap hidden" aria-live="polite">
      <div class="progress-track">
        <div id="sync-progress-bar" class="progress-bar"></div>
      </div>
      <div class="progress-meta">
        <span id="sync-progress-label">Preparando sincronização...</span>
        <span id="sync-progress-count">0%</span>
      </div>
    </div>

    <div class="grid" id="asset-grid"></div>
  </div>

  <div class="log" id="log"></div>
</div>

<script>
  function log(msg) {
    const el = document.getElementById("log");
    el.textContent += msg + "\n";
    el.scrollTop = el.scrollHeight;
  }

  function setSyncProgress(current, total, label) {
    const status = document.getElementById("sync-status");
    const progress = document.getElementById("sync-progress");
    const bar = document.getElementById("sync-progress-bar");
    const progressLabel = document.getElementById("sync-progress-label");
    const progressCount = document.getElementById("sync-progress-count");

    status.classList.remove("hidden");
    progress.classList.remove("hidden");

    const percent = total > 0 ? Math.min(100, Math.round((current / total) * 100)) : 0;

    bar.style.width = percent + "%";
    progressLabel.textContent = label;
    progressCount.textContent = percent + "%";
  }

  function finishSyncProgress(label) {
    const bar = document.getElementById("sync-progress-bar");
    const progressLabel = document.getElementById("sync-progress-label");
    const progressCount = document.getElementById("sync-progress-count");

    bar.style.width = "100%";
    progressLabel.textContent = label;
    progressCount.textContent = "100%";
  }

  const sb = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );

  let providerToken =
    sessionStorage.getItem("bruma_google_access_token") || null;

  let providerRefreshToken =
    sessionStorage.getItem("bruma_google_refresh_token") || null;

  let currentWorkspaceId = null;
  let currentConnectionId = null;
  let loginHandled = false;

  function saveGoogleTokens(session) {
    if (session && session.provider_token) {
      providerToken = session.provider_token;
      sessionStorage.setItem(
        "bruma_google_access_token",
        providerToken
      );
    }

    if (session && session.provider_refresh_token) {
      providerRefreshToken = session.provider_refresh_token;
      sessionStorage.setItem(
        "bruma_google_refresh_token",
        providerRefreshToken
      );
    }
  }

  function clearGoogleTokens() {
    providerToken = null;
    providerRefreshToken = null;

    sessionStorage.removeItem("bruma_google_access_token");
    sessionStorage.removeItem("bruma_google_refresh_token");
  }

  async function startGoogleLogin() {
    loginHandled = false;
    clearGoogleTokens();

    await sb.auth.signOut();

    const { error } = await sb.auth.signInWithOAuth({
      provider: "google",
      options: {
        scopes: "https://www.googleapis.com/auth/drive.readonly",
        redirectTo:
          window.location.origin + window.location.pathname,
        queryParams: {
          access_type: "offline",
          prompt: "consent"
        }
      }
    });

    if (error) {
      log("Erro ao iniciar login: " + error.message);
    }
  }

  document
    .getElementById("login-btn")
    .addEventListener("click", startGoogleLogin);

  document
    .getElementById("logout-btn")
    .addEventListener("click", async () => {
      loginHandled = false;
      clearGoogleTokens();

      currentWorkspaceId = null;
      currentConnectionId = null;

      const { error } = await sb.auth.signOut();

      if (error) {
        log("Erro ao sair: " + error.message);
        return;
      }

      document
        .getElementById("app-section")
        .classList.add("hidden");

      document
        .getElementById("login-section")
        .classList.remove("hidden");

      document
        .getElementById("sync-status")
        .classList.add("hidden");

      document
        .getElementById("sync-progress")
        .classList.add("hidden");

      document.getElementById("asset-grid").innerHTML = "";

      document.getElementById("log").textContent =
        "Sessão encerrada.\n";
    });

  sb.auth.onAuthStateChange(async (event, session) => {
    if (event === "SIGNED_OUT") {
      loginHandled = false;
      clearGoogleTokens();

      document
        .getElementById("app-section")
        .classList.add("hidden");

      document
        .getElementById("login-section")
        .classList.remove("hidden");

      return;
    }

    if (
      (event === "SIGNED_IN" || event === "INITIAL_SESSION") &&
      session
    ) {
      saveGoogleTokens(session);
    }

    if (session && providerToken && !loginHandled) {
      await checkTokenScope();
      await afterLogin(session);
    } else if (
      session &&
      !providerToken &&
      event === "SIGNED_IN"
    ) {
      log(
        "A sessão do Google foi criada, mas a autorização do Drive não chegou ao navegador. Clique em Sair e entre novamente."
      );
    }
  });

  async function checkTokenScope() {
    if (!providerToken) return;

    try {
      const res = await fetch(
        "https://www.googleapis.com/oauth2/v3/tokeninfo?access_token=" +
        encodeURIComponent(providerToken)
      );

      const data = await res.json();

      if (data.scope) {
        log("Diagnóstico: autorização do Drive recebida.");

        log(
          "Diagnóstico: tem drive.readonly? " +
          (
            data.scope.includes("drive.readonly")
              ? "sim"
              : "NÃO"
          )
        );
      } else {
        log(
          "Diagnóstico: a autorização do Google não pôde ser validada. Entre novamente."
        );
      }
    } catch (err) {
      log(
        "Diagnóstico: falha ao validar a autorização do Google: " +
        err.message
      );
    }
  }

  async function afterLogin(session) {
    if (loginHandled || !providerToken) return;

    loginHandled = true;

    document
      .getElementById("login-section")
      .classList.add("hidden");

    document
      .getElementById("app-section")
      .classList.remove("hidden");

    document.getElementById("user-info").textContent =
      "Logado como " + session.user.email;

    let { data: workspaces } = await sb
      .from("workspaces")
      .select("id")
      .eq("owner_id", session.user.id)
      .limit(1);

    if (!workspaces || workspaces.length === 0) {
      const { data: created, error } = await sb
        .from("workspaces")
        .insert({
          owner_id: session.user.id,
          name: "Meu workspace"
        })
        .select("id")
        .single();

      if (error) {
        log(
          "Erro ao criar workspace: " +
          error.message
        );
        return;
      }

      currentWorkspaceId = created.id;
      log("Workspace criado.");
    } else {
      currentWorkspaceId = workspaces[0].id;
    }

    const { data: existingConn } = await sb
      .from("cloud_connections")
      .select("id")
      .eq("workspace_id", currentWorkspaceId)
      .eq("provider", "google_drive")
      .limit(1);

    if (existingConn && existingConn.length > 0) {
      currentConnectionId = existingConn[0].id;

      await sb
        .from("cloud_connections")
        .update({
          access_token: providerToken,
          ...(providerRefreshToken
            ? {
                refresh_token:
                  providerRefreshToken
              }
            : {})
        })
        .eq("id", currentConnectionId);

      log(
        "Conexão com o Google Drive atualizada." +
        (
          providerRefreshToken
            ? " Refresh token recebido e salvo."
            : ""
        )
      );
    } else {
      const { data: conn, error } = await sb
        .from("cloud_connections")
        .insert({
          workspace_id: currentWorkspaceId,
          provider: "google_drive",
          access_token: providerToken,
          refresh_token: providerRefreshToken
        })
        .select("id")
        .single();

      if (error) {
        log(
          "Erro ao salvar conexão: " +
          error.message
        );
        return;
      }

      currentConnectionId = conn.id;

      log(
        "Conexão com o Google Drive criada."
      );
    }
  }

  document
    .getElementById("sync-btn")
    .addEventListener("click", async () => {
      const folderId =
        document
          .getElementById("folder-id")
          .value
          .trim();

      const syncBtn =
        document.getElementById("sync-btn");

      const grid =
        document.getElementById("asset-grid");

      if (!folderId) {
        log(
          "Cole o ID de uma pasta do Drive primeiro."
        );
        return;
      }

      if (!providerToken) {
        log(
          "Sem token do Google nesta sessão. Saia e entre de novo pra gerar um novo."
        );
        return;
      }

      syncBtn.disabled = true;
      grid.innerHTML = "";

      setSyncProgress(
        0,
        1,
        "Encontrando arquivos no Drive..."
      );

      log(
        "Buscando arquivos da pasta " +
        folderId +
        " (incluindo subpastas)..."
      );

      const FOLDER_MIME =
        "application/vnd.google-apps.folder";

      let files = [];
      let foldersScanned = 0;

      async function listFolder(id) {
        foldersScanned++;

        setSyncProgress(
          0,
          1,
          "Encontrando arquivos... " +
          foldersScanned +
          " pasta(s) verificadas"
        );

        let pageToken = null;

        do {
          const url =
            "https://www.googleapis.com/drive/v3/files" +
            "?q=" +
            encodeURIComponent(
              `'${id}' in parents and trashed = false`
            ) +
            "&fields=" +
            encodeURIComponent(
              "nextPageToken,files(id,name,mimeType,thumbnailLink,imageMediaMetadata)"
            ) +
            "&pageSize=1000" +
            (
              pageToken
                ? "&pageToken=" + pageToken
                : ""
            );

          const res = await fetch(url, {
            headers: {
              Authorization:
                "Bearer " + providerToken
            }
          });

          if (!res.ok) {
            const body = await res.text();

            throw new Error(
              "Erro da Drive API (" +
              res.status +
              "): " +
              body
            );
          }

          const data = await res.json();

          for (const item of (data.files || [])) {
            if (item.mimeType === FOLDER_MIME) {
              await listFolder(item.id);
            } else {
              files.push(item);

              setSyncProgress(
                0,
                1,
                files.length +
                " arquivo(s) encontrado(s)..."
              );
            }
          }

          pageToken =
            data.nextPageToken || null;

        } while (pageToken);
      }

      try {
        await listFolder(folderId);
      } catch (err) {
        syncBtn.disabled = false;

        document.getElementById(
          "sync-status"
        ).textContent =
          "A sincronização não foi concluída.";

        document
          .getElementById("sync-progress")
          .classList.add("hidden");

        log(err.message);
        return;
      }

      setSyncProgress(
        0,
        Math.max(files.length, 1),
        "Preparando " +
        files.length +
        " arquivo(s) para salvar..."
      );

      log(
        files.length +
        " arquivo(s) encontrado(s) em " +
        foldersScanned +
        " pasta(s). Criando a galeria e salvando..."
      );

      let { data: galleries } = await sb
        .from("galleries")
        .select("id")
        .eq("folder_id", folderId)
        .limit(1);

      let galleryId;

      if (galleries && galleries.length > 0) {
        galleryId = galleries[0].id;
      } else {
        const {
          data: gallery,
          error
        } = await sb
          .from("galleries")
          .insert({
            workspace_id:
              currentWorkspaceId,
            cloud_connection_id:
              currentConnectionId,
            title:
              "Pasta " + folderId,
            slug:
              "pasta-" +
              folderId
                .slice(0, 8)
                .toLowerCase(),
            folder_id:
              folderId
          })
          .select("id")
          .single();

        if (error) {
          syncBtn.disabled = false;

          log(
            "Erro ao criar galeria: " +
            error.message
          );

          return;
        }

        galleryId = gallery.id;
      }

      let savedCount = 0;
      let errorCount = 0;

      for (
        let index = 0;
        index < files.length;
        index++
      ) {
        const file = files[index];

        const {
          error: assetError
        } = await sb
          .from("assets")
          .upsert(
            {
              gallery_id:
                galleryId,
              provider_file_id:
                file.id,
              filename:
                file.name,
              thumbnail_url:
                file.thumbnailLink ||
                null,
              width:
                file.imageMediaMetadata
                  ? file.imageMediaMetadata.width
                  : null,
              height:
                file.imageMediaMetadata
                  ? file.imageMediaMetadata.height
                  : null
            },
            {
              onConflict:
                "provider_file_id"
            }
          );

        if (assetError) {
          errorCount++;

          log(
            "Erro ao salvar \"" +
            file.name +
            "\": " +
            assetError.message
          );
        } else {
          savedCount++;

          if (file.thumbnailLink) {
            const img =
              document.createElement(
                "img"
              );

            img.src =
              file.thumbnailLink;

            img.title =
              file.name;

            grid.appendChild(img);
          }
        }

        const completed =
          index + 1;

        setSyncProgress(
          completed,
          Math.max(
            files.length,
            1
          ),
          "Salvando arquivos... " +
          completed +
          " de " +
          files.length
        );
      }

      if (files.length === 0) {
        finishSyncProgress(
          "Nenhum arquivo encontrado"
        );

        document.getElementById(
          "sync-status"
        ).textContent =
          "A pasta não contém arquivos sincronizáveis.";
      } else {
        finishSyncProgress(
          "Sincronização concluída"
        );

        document.getElementById(
          "sync-status"
        ).textContent =
          savedCount +
          " de " +
          files.length +
          " arquivo(s) salvo(s)" +
          (
            errorCount > 0
              ? " • " +
                errorCount +
                " com erro"
              : ""
          );
      }

      log(
        "Sincronização concluída. " +
        savedCount +
        " de " +
        files.length +
        " salvos em assets."
      );

      syncBtn.disabled = false;
    });
</script>
</body>
</html>
