<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bruma: painel de sincronização</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--sky-top:#4A8FD6;--sky-mid:#8FC1EA;--sky-bottom:#EEF6FC;--ink:#233240;--ink-soft:#5C7286;--blue-deep:#2E6CA8;--line:#D7E6F2;--glass:rgba(255,255,255,.78)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;line-height:1.55;background:linear-gradient(180deg,var(--sky-top),var(--sky-mid) 40%,var(--sky-bottom))}
.wrap{max-width:760px;margin:0 auto;padding:48px 20px 80px}.kicker{color:#fff;font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;text-shadow:0 1px 6px #0003}
h1{font-family:'Fraunces',serif;color:#fff;font-size:30px;margin:8px 0 28px;text-shadow:0 2px 12px #00285030}h2{font-size:17px;margin:0 0 12px}
.card{background:var(--glass);border:1px solid #ffffffcc;border-radius:18px;padding:22px;margin-bottom:16px;box-shadow:0 14px 34px -22px #00285059}.card p{margin:0 0 14px;color:var(--ink-soft);font-size:14px}
button{background:var(--blue-deep);color:white;border:0;border-radius:999px;padding:11px 20px;font-weight:700;cursor:pointer;font-size:14px}button:disabled{opacity:.5;cursor:wait}
input{border:1px solid var(--line);background:white;border-radius:9px;padding:11px 13px;font-size:14px;font-family:inherit;color:var(--ink);min-width:0;flex:1}.row{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.session-row{display:flex;justify-content:space-between;align-items:center;gap:12px}#user-info{color:var(--ink);font-weight:700;font-size:14px}
.logout-btn{background:#ffffff99;color:var(--ink-soft);border:1px solid #5c728640;padding:7px 14px;font-size:12px}
.log{background:#ffffff99;border:1px solid #ffffffcc;border-radius:14px;padding:14px;font-size:12px;color:var(--ink-soft);white-space:pre-wrap;max-height:200px;overflow:auto;font-family:ui-monospace,monospace}
.hidden{display:none!important}#sync-status{font-size:13px;color:var(--ink-soft);margin:0 0 12px;min-height:18px}
.progress-wrap{margin:0 0 18px}.progress-track{width:100%;height:8px;background:#ffffffa6;border:1px solid #ffffffcc;border-radius:99px;overflow:hidden}.progress-bar{height:100%;width:0;background:var(--blue-deep);border-radius:99px;transition:width .2s}
.progress-meta{display:flex;justify-content:space-between;gap:12px;margin-top:6px;font-size:12px;color:var(--ink-soft)}
.gallery-list{display:grid;gap:9px;margin-top:12px}.gallery-item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#ffffff70}
.gallery-item strong{display:block;font-size:13px}.gallery-item small{display:block;color:var(--ink-soft);font-size:11px}.gallery-actions{display:flex;gap:7px;flex-shrink:0}
.secondary{background:#ffffffa8;color:var(--blue-deep);border:1px solid var(--line);padding:7px 12px;font-size:12px}.remove-btn{background:transparent;border:1px solid #c8505080;color:#b84c4c;padding:7px 12px;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:9px;margin-top:14px}.asset{min-width:0}.asset img{display:block;width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;background:var(--line);border:1px solid #ffffffcc}.asset small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-soft);font-size:11px;margin-top:4px}
.empty-note{font-size:13px;color:var(--ink-soft)}@media(max-width:520px){.wrap{padding:32px 14px 56px}.card{padding:18px}.row button{width:100%}.gallery-actions button{padding:7px 9px}}
</style>
</head>
<body>
<main class="wrap">
<div class="kicker">Bruma</div><h1>Painel de sincronização</h1>
<section class="card" id="login-section"><p>Entre com sua conta Google para conectar o Drive.</p><button id="login-btn" type="button">Entrar com Google</button><p id="login-status" role="status" aria-live="polite" style="margin:12px 0 0;white-space:pre-wrap"></p></section>
<section class="card hidden" id="app-section">
<div class="session-row"><p id="user-info"></p><button id="logout-btn" class="logout-btn" type="button">Sair</button></div>
<h2>Sincronizar uma pasta</h2><div class="row"><input id="folder-id" autocomplete="off" placeholder="ID da pasta do Google Drive" aria-label="ID da pasta do Google Drive"><button id="sync-btn" type="button">Sincronizar pasta</button></div>
<div id="sync-status" class="hidden" role="status" aria-live="polite"></div>
<div id="sync-progress" class="progress-wrap hidden" aria-live="polite"><div class="progress-track"><div id="sync-progress-bar" class="progress-bar"></div></div><div class="progress-meta"><span id="sync-progress-label">Preparando sincronização...</span><span id="sync-progress-count">0%</span></div></div>
<h2>Suas galerias</h2><div id="gallery-list" class="gallery-list"><p class="empty-note">Carregando galerias...</p></div><h2 style="margin-top:22px">Arquivos</h2><div class="grid" id="asset-grid"></div>
</section>
<div class="log" id="log" role="log" aria-live="polite">Bruma conectado à nova infraestrutura Cloudflare.</div>
</main>
<script>
const API_BASE="https://bruma-api.studio-gh.workers.dev",SESSION_KEY="bruma_session_token";
let sessionToken=sessionStorage.getItem(SESSION_KEY),currentUser=null;
const $=id=>document.getElementById(id);
function log(message){$("log").textContent+="\n"+message;$("log").scrollTop=$("log").scrollHeight}
function busy(button,value,label){button.disabled=value;if(label)button.textContent=label}
function progress(current,total,label){$("sync-status").classList.remove("hidden");$("sync-progress").classList.remove("hidden");const pct=total?Math.min(100,Math.round(current/total*100)):0;$("sync-progress-bar").style.width=pct+"%";$("sync-progress-label").textContent=label;$("sync-progress-count").textContent=pct+"%"}
async function api(path,options={}){const headers=new Headers(options.headers||{});if(sessionToken)headers.set("Authorization","Bearer "+sessionToken);if(options.body)headers.set("Content-Type","application/json");const res=await fetch(API_BASE+path,{...options,headers,cache:"no-store"});const data=await res.json().catch(()=>({}));if(!res.ok){const err=new Error(data.error||"Erro na API ("+res.status+")");err.status=res.status;throw err}return data}
function clearSession(){sessionToken=null;currentUser=null;sessionStorage.removeItem(SESSION_KEY)}
function showLogin(message=""){$("login-section").classList.remove("hidden");$("app-section").classList.add("hidden");$("login-status").textContent=message;busy($("login-btn"),false,"Entrar com Google")}
function showApp(){ $("login-section").classList.add("hidden");$("app-section").classList.remove("hidden");$("user-info").textContent=currentUser?.name?currentUser.name+" · "+currentUser.email:(currentUser?.email||"Sessão ativa")}
async function loadGalleries(){const data=await api("/api/galleries"),list=$("gallery-list");list.innerHTML="";if(!data.galleries?.length){list.innerHTML='<p class="empty-note">Ainda não há galerias. Cole o ID de uma pasta do Drive para começar.</p>';return}
for(const g of data.galleries){const row=document.createElement("div");row.className="gallery-item";const info=document.createElement("div"),title=document.createElement("strong"),meta=document.createElement("small");title.textContent=g.title||"Galeria";meta.textContent=(g.asset_count||0)+" arquivo(s) · "+g.folder_id;info.append(title,meta);const actions=document.createElement("div");actions.className="gallery-actions";const open=document.createElement("button");open.className="secondary";open.textContent="Abrir";open.addEventListener("click",()=>loadAssets(g.id));const del=document.createElement("button");del.className="remove-btn";del.textContent="Excluir";del.addEventListener("click",()=>deleteGallery(g.id,g.title));actions.append(open,del);row.append(info,actions);list.append(row)}}
async function loadAssets(id){const data=await api("/api/galleries/"+encodeURIComponent(id)+"/assets"),grid=$("asset-grid");grid.innerHTML="";for(const a of data.assets||[]){const figure=document.createElement("div");figure.className="asset";if(a.thumbnail_url){const img=document.createElement("img");img.src=a.thumbnail_url;img.alt=a.filename||"Arquivo do Drive";img.loading="lazy";figure.append(img)}else{const no=document.createElement("small");no.textContent="Sem miniatura";figure.append(no)}const name=document.createElement("small");name.textContent=a.filename||"";figure.append(name);grid.append(figure)}log((data.assets||[]).length+" arquivo(s) carregados.")}
async function deleteGallery(id,title){if(!confirm('Excluir a galeria "'+(title||"sem título")+'" e seus registros?'))return;try{await api("/api/galleries/"+encodeURIComponent(id),{method:"DELETE"});$("asset-grid").innerHTML="";await loadGalleries();log("Galeria excluída.")}catch(e){log("Falha ao excluir galeria: "+e.message)}}
async function exchangeCode(){const url=new URL(location.href),code=url.searchParams.get("bruma_code");if(!code)return false;url.searchParams.delete("bruma_code");history.replaceState({},document.title,url.pathname+url.search+url.hash);busy($("login-btn"),true,"Finalizando login...");try{const data=await api("/auth/exchange",{method:"POST",body:JSON.stringify({code})});if(!data.token)throw new Error("Servidor não retornou sessão.");sessionToken=data.token;sessionStorage.setItem(SESSION_KEY,sessionToken);return true}catch(e){clearSession();showLogin("Não foi possível finalizar o login. "+e.message);log("Falha ao trocar código de login: "+e.message);return false}}
async function restoreSession(){if(!sessionToken)return false;try{const data=await api("/auth/me");currentUser=data.user;showApp();await loadGalleries();log("Sessão restaurada.");return true}catch(e){clearSession();if(e.status!==401)log("Falha ao restaurar sessão: "+e.message);return false}}
$("login-btn").addEventListener("click",()=>{busy($("login-btn"),true,"Abrindo Google...");$("login-status").textContent="Redirecionando para a autorização segura do Google...";location.assign(API_BASE+"/auth/google")});
$("logout-btn").addEventListener("click",async()=>{try{await api("/auth/logout",{method:"POST"})}catch(e){log("Aviso ao encerrar sessão: "+e.message)}clearSession();$("asset-grid").innerHTML="";$("gallery-list").innerHTML="";showLogin("Sessão encerrada.");log("Sessão encerrada.")});
$("sync-btn").addEventListener("click",async()=>{const folder=$("folder-id").value.trim(),button=$("sync-btn");if(!folder){log("Cole o ID de uma pasta do Drive primeiro.");return}busy(button,true,"Sincronizando...");$("asset-grid").innerHTML="";progress(0,1,"Buscando arquivos no Google Drive...");log("Iniciando sincronização da pasta "+folder+" e suas subpastas.");try{progress(1,2,"Lendo pasta e registrando arquivos...");const result=await api("/api/sync",{method:"POST",body:JSON.stringify({folder_id:folder})});progress(2,2,"Sincronização concluída.");$("sync-status").textContent=result.files_saved+" de "+result.files_found+" arquivo(s) registrados.";await loadAssets(result.gallery_id);await loadGalleries();log("Concluído: "+result.files_saved+" arquivo(s), "+result.folders_scanned+" pasta(s) verificada(s).")}catch(e){$("sync-status").textContent="A sincronização não foi concluída.";$("sync-progress").classList.add("hidden");log("Erro na sincronização: "+e.message);if(e.status===401){clearSession();showLogin("Sua sessão expirou. Entre novamente.")}}finally{busy(button,false,"Sincronizar pasta")}});
(async()=>{try{const exchanged=await exchangeCode();if(exchanged&&await restoreSession())return;if(!exchanged&&new URL(location.href).searchParams.has("bruma_code"))return;if(await restoreSession())return;showLogin()}catch(e){showLogin(e.message);log("Falha ao iniciar Bruma: "+e.message)}})();
</script>
</body>
</html>
